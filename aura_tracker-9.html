<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aura Tracker — Build Your Aura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#DC2626;--green:#10B981;--orange:#F59E0B;--border:#E5E7EB;--muted:#6B7280;--bg:#F9FAFB;--text:#111827}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at top left,#fff1f2 0%,#fff 42%,#f8fafc 100%);color:var(--text);font-family:"DM Sans",Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;scroll-behavior:smooth}
@keyframes riseIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes softPop{0%{transform:scale(.96);opacity:.7}100%{transform:scale(1);opacity:1}}
@keyframes glowPulse{0%,100%{box-shadow:0 8px 22px #dc262633}50%{box-shadow:0 10px 30px #dc262655}}
@keyframes shimmer{0%{background-position:0% 50%}100%{background-position:200% 50%}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.app{width:100%;max-width:560px;margin:0 auto;min-height:100dvh;padding:calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));animation:riseIn .55s ease both}
.header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}
.header-left{display:flex;align-items:center;gap:11px;min-width:0}
.back-btn{height:42px;min-width:42px;border:1px solid #fecdd3;border-radius:14px;background:#fff;color:#be123c;font-size:22px;font-weight:700;display:grid;place-items:center;box-shadow:0 4px 12px #8813370b;transition:transform .2s,background .2s}
.back-btn:active{transform:scale(.92);background:#fff1f2}
.brand-title{font-family:"Space Grotesk","DM Sans",sans-serif;font-size:26px;line-height:1.15;margin:0;font-weight:700;letter-spacing:-1px;background:linear-gradient(110deg,#111827 0%,#be123c 55%,#f97316 100%);background-size:200% auto;color:transparent;background-clip:text;-webkit-background-clip:text;animation:shimmer 7s linear infinite}
.brand-sub{font-size:11px;color:var(--muted);margin-top:5px;font-weight:600;letter-spacing:.15px}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:1.3px;color:var(--red);margin-bottom:5px}
h1{font-family:"Space Grotesk","DM Sans",sans-serif;font-size:25px;line-height:1.2;margin:0;font-weight:700;letter-spacing:-.7px}
.icon-btn{width:44px;height:44px;border:1px solid #ffe4e6;background:linear-gradient(145deg,#fff,#fff1f2);border-radius:14px;display:grid;place-items:center;color:#be123c;flex-shrink:0;transition:transform .2s,box-shadow .2s}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:21px;height:21px}
.date-strip{display:flex;gap:8px;overflow-x:auto;padding:2px 1px 10px;scrollbar-width:none;overscroll-behavior-x:contain}
.date-strip::-webkit-scrollbar{display:none}
.date-chip{min-width:54px;height:68px;border:1px solid var(--border);border-radius:15px;background:#ffffffd9;color:#374151;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;flex-shrink:0;transition:transform .2s,border-color .2s,box-shadow .2s}
.date-chip .day{font-size:10px;color:var(--muted);font-weight:750;letter-spacing:.4px}
.date-chip .num{font-size:17px;font-weight:750}
.date-chip.today:not(.selected) .day,.date-chip.today:not(.selected) .num{color:var(--red)}
.date-chip.selected{background:linear-gradient(145deg,#ef4444,#be123c);border-color:var(--red);color:white;box-shadow:0 7px 18px #dc262633;transform:translateY(-2px)}
.date-chip.selected .day{color:#FEE2E2}
.quick-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:2px 0 12px}
.quick-action{display:flex;align-items:center;gap:9px;min-height:54px;padding:10px 12px;border:1px solid #f1f5f9;border-radius:16px;background:linear-gradient(145deg,#fff,#fffafa);color:var(--text);font-size:13px;font-weight:800;text-align:left;box-shadow:0 5px 15px #0f172a08;transition:transform .2s,border-color .2s,box-shadow .2s;animation:riseIn .45s ease both}
.quick-action:nth-child(2){animation-delay:.04s}.quick-action:nth-child(3){animation-delay:.08s}.quick-action:nth-child(4){animation-delay:.12s}
.quick-action:hover{transform:translateY(-2px);border-color:#fecdd3;box-shadow:0 9px 20px #dc262610}
.quick-action:active{background:#FEF2F2;border-color:var(--red)}
.quick-action .qa-icon{width:34px;height:34px;border-radius:12px;background:linear-gradient(145deg,#fff1f2,#ffe4e6);display:grid;place-items:center;font-size:18px;flex-shrink:0;transition:transform .25s}
.quick-action:hover .qa-icon{transform:rotate(-7deg) scale(1.08)}
.tabs{display:flex;gap:7px;margin:12px 0 16px}
.tab{flex:1;border:1px solid var(--border);border-radius:999px;background:white;color:#4B5563;min-height:42px;font-size:13px;font-weight:650}
.tab span{margin-left:5px;color:#9CA3AF}
.tab.active{background:var(--red);border-color:var(--red);color:white}
.tab.active span{color:#FEE2E2}
.progress-card{border:1px solid #ffe4e6;border-radius:18px;padding:16px;margin-bottom:18px;background:linear-gradient(135deg,#fff 0%,#fff7f7 100%);box-shadow:0 8px 22px #88133708;animation:riseIn .5s ease both}
.progress-top{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;font-weight:650}
.progress-percent{color:var(--red);font-size:14px;font-weight:800}
.progress-track{height:6px;background:#F3F4F6;border-radius:999px;overflow:hidden;margin-top:12px}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,#f97316,#ef4444,#be123c);background-size:200% 100%;border-radius:999px;transition:width .55s cubic-bezier(.2,.8,.2,1);animation:shimmer 3s linear infinite}
.section-heading{font-size:15px;font-weight:750;margin:0 0 10px}
.habit-list{display:flex;flex-direction:column;gap:9px}
.habit-card{border:1px solid #edf0f4;border-radius:16px;padding:13px;display:flex;align-items:center;gap:11px;min-width:0;cursor:pointer;background:#ffffffed;box-shadow:0 4px 13px #0f172a06;transition:transform .2s,border-color .2s,box-shadow .2s;animation:riseIn .32s ease both}
.habit-card:hover{transform:translateY(-2px);border-color:#fecdd3;box-shadow:0 8px 20px #8813370c}
.habit-icon{width:42px;height:42px;flex-shrink:0;border-radius:10px;background:#F9FAFB;display:grid;place-items:center;font-size:21px;border:1px solid #F3F4F6}
.habit-main{min-width:0;flex:1}
.habit-name{font-size:14px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:5px}
.habit-card.done .habit-name{text-decoration:line-through;color:#6B7280}
.habit-meta{font-size:11px;color:var(--muted);line-height:1.5;overflow-wrap:anywhere}
.priority{display:inline-block;font-size:10px;font-weight:750;padding:4px 7px;border-radius:999px;margin-top:6px}
.priority.low{background:#D1FAE5;color:#047857}.priority.medium{background:#FEF3C7;color:#B45309}.priority.high{background:#FEE2E2;color:#B91C1C}
.check{width:27px;height:27px;border:1.7px solid #D1D5DB;border-radius:50%;display:grid;place-items:center;flex-shrink:0;background:white;color:white;padding:0}
.check.checked{background:var(--green);border-color:var(--green)}
.check:disabled{opacity:.35;cursor:not-allowed}
.empty{text-align:center;padding:35px 16px 26px;border:1px dashed #D1D5DB;border-radius:12px}
.empty-icon{font-size:30px;margin-bottom:10px}.empty h2{font-size:17px;margin:0 0 6px}.empty p{font-size:13px;color:var(--muted);margin:0 0 17px}
.primary{border:1px solid var(--red);background:var(--red);color:white;border-radius:12px;min-height:44px;padding:0 16px;font-weight:700;font-size:13px}
.fab{position:fixed;right:max(20px,calc((100vw - 560px)/2 + 18px));bottom:calc(20px + env(safe-area-inset-bottom));height:56px;width:56px;border:0;border-radius:20px;background:linear-gradient(145deg,#f43f5e,#be123c);color:white;box-shadow:0 8px 22px #dc262644;display:grid;place-items:center;font-size:29px;z-index:5;animation:glowPulse 2.5s ease-in-out infinite;transition:transform .2s}
.fab:active{transform:scale(.9) rotate(8deg)}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.42);backdrop-filter:blur(5px);z-index:10;display:flex;align-items:flex-end;justify-content:center;animation:softPop .2s ease both}
.sheet{background:linear-gradient(180deg,#fff 0%,#fffafa 100%);width:100%;max-width:560px;max-height:92dvh;overflow:auto;border:1px solid #ffe4e6;border-radius:22px 22px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));animation:riseIn .25s ease both}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.sheet-head h2{font-size:18px;margin:0}
.close-btn{border:0;background:#F3F4F6;border-radius:10px;width:36px;height:36px;font-size:22px;color:#374151}
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.field label{font-size:12px;font-weight:750;color:#374151}
.field input,.field select,.field textarea{width:100%;border:1px solid #D1D5DB;border-radius:10px;min-height:43px;padding:10px 11px;background:white;color:var(--text)}
.field textarea{min-height:82px;resize:vertical}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.icon-grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.icon-option{border:1px solid var(--border);background:white;border-radius:9px;min-height:39px;font-size:20px;padding:3px}
.icon-option.chosen{border:2px solid var(--red);background:#FEF2F2}
.form-actions{display:flex;gap:9px;margin-top:18px}
.form-actions button{flex:1}
.secondary{border:1px solid #D1D5DB;background:white;color:#374151;border-radius:12px;min-height:44px;padding:0 14px;font-weight:700;font-size:13px}
.delete-btn{width:100%;margin-top:10px;border:0;background:white;color:var(--red);min-height:42px;font-weight:700}
.error{font-size:12px;color:var(--red);margin-top:-6px;margin-bottom:10px;display:none}
.stats-summary{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:18px}
.summary-card{border:1px solid var(--border);border-radius:12px;padding:13px}
.summary-label{font-size:11px;color:var(--muted);margin-bottom:8px}
.summary-value{font-size:23px;font-weight:800}
.summary-sub{font-size:11px;color:var(--muted);margin-top:4px}
.week-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.week-label{font-size:13px;font-weight:750;text-align:center;flex:1}
.week-arrow{width:38px;height:38px;border:1px solid var(--border);border-radius:10px;background:white;font-size:18px}
.week-arrow:disabled{opacity:.3;cursor:not-allowed}
.stats-title{font-size:14px;font-weight:750;margin:18px 0 10px}
.daily-bars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end}
.day-bar{text-align:center;min-width:0}
.bar-area{height:100px;display:flex;align-items:flex-end;justify-content:center;background:#F9FAFB;border-radius:8px 8px 4px 4px;overflow:hidden}
.bar-fill{width:100%;background:var(--red);min-height:0;border-radius:5px 5px 0 0}
.bar-pct{font-size:10px;color:var(--muted);margin-top:5px;min-height:13px}
.bar-day{font-size:10px;font-weight:750;margin-top:4px}
.habit-stat{margin:12px 0}
.habit-stat-top{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin-bottom:7px}
.habit-stat-name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.habit-stat-count{color:var(--muted);white-space:nowrap}
.small-track{height:5px;background:#F3F4F6;border-radius:999px;overflow:hidden}
.small-fill{height:100%;background:var(--red)}
.no-stats{font-size:13px;color:var(--muted);padding:14px 0}
.start-task{border:0;border-radius:10px;background:linear-gradient(145deg,#f43f5e,#be123c);color:#fff;font-size:11px;font-weight:800;padding:9px 10px;min-height:34px;white-space:nowrap;box-shadow:0 4px 12px #dc262626;transition:transform .18s,box-shadow .18s}
.start-task:active{transform:scale(.92)}
.timer-panel{text-align:center;padding:10px 4px 4px;animation:riseIn .3s ease both}
.timer-ring{--timer-progress:100%;width:210px;height:210px;margin:18px auto 22px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#e11d48 var(--timer-progress),#ffe4e6 0);position:relative;box-shadow:0 12px 35px #e11d4822;animation:softPop .35s ease both}
.timer-ring:before{content:"";position:absolute;inset:9px;background:linear-gradient(145deg,#fff,#fff7f7);border-radius:50%}
.timer-inner{position:relative;z-index:1}
.timer-digits{font-family:"Space Grotesk",sans-serif;font-size:43px;font-weight:700;letter-spacing:-1.5px;font-variant-numeric:tabular-nums;transition:transform .12s,color .12s}
.timer-digits.tick{animation:timerTick .24s ease}
@keyframes timerTick{0%{transform:scale(1.08);color:#e11d48}100%{transform:scale(1);color:#111827}}
.timer-caption{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:1.5px;margin-top:3px}
.timer-hint{font-size:13px;color:var(--muted);line-height:1.5;max-width:280px;margin:0 auto 18px}
.timer-actions{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
.timer-actions button{min-width:100px}
.timer-session{font-size:12px;color:#be123c;font-weight:800;background:#fff1f2;border-radius:999px;padding:7px 11px;display:inline-block}
.toast{position:fixed;left:50%;bottom:calc(85px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111827;color:white;padding:10px 14px;border-radius:10px;font-size:12px;z-index:30;max-width:calc(100% - 32px);display:none}
@media(min-width:600px){.overlay{align-items:center;padding:20px}.sheet{border-radius:16px;max-height:88dvh}.app{padding-top:28px}}
</style>
</head>
<body>
<main class="app">
  <header class="header">
    <div class="header-left"><button type="button" class="back-btn" id="backBtn" aria-label="Go back" title="Go back">←</button><div><div class="eyebrow" id="dateEyebrow">TODAY</div><h1 class="brand-title">Aura Tracker</h1><div class="brand-sub" id="dateTitle">October 21, 2026</div></div></div>
    <button class="icon-btn" id="statsOpen" aria-label="Open weekly stats" title="Weekly stats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V5M4 19H21"/><path d="M8 16v-5M13 16V7M18 16v-8"/></svg>
    </button>
  </header>

  <div class="date-strip" id="dateStrip" aria-label="Choose date"></div>

  <!-- One-tap quick-add buttons -->
  <section class="quick-actions" aria-label="Quick add habits">
    <button type="button" class="quick-action" data-quick="Workout"><span class="qa-icon">🏋️</span><span>Workout</span></button>
    <button type="button" class="quick-action" data-quick="Study"><span class="qa-icon">📚</span><span>Study</span></button>
    <button type="button" class="quick-action" data-quick="Book Reading"><span class="qa-icon">📖</span><span>Book Reading</span></button>
    <button type="button" class="quick-action" data-quick="Stretching + Meditation"><span class="qa-icon">🧘</span><span>Stretching + Meditation</span></button>
  </section>

  <div class="tabs" role="tablist" aria-label="Habit filter">
    <button class="tab active" data-filter="all" role="tab">All <span id="countAll">0</span></button>
    <button class="tab" data-filter="pending" role="tab">Pending <span id="countPending">0</span></button>
    <button class="tab" data-filter="done" role="tab">Done <span id="countDone">0</span></button>
  </div>

  <section class="progress-card" aria-label="Daily progress">
    <div class="progress-top"><span id="progressText">0 of 0 habits done</span><span class="progress-percent" id="progressPercent">0%</span></div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  </section>

  <section>
    <h2 class="section-heading" id="listHeading">Your habits</h2>
    <div class="habit-list" id="habitList"></div>
    <div class="empty" id="emptyState" hidden>
      <div class="empty-icon" id="emptyIcon">🌱</div>
      <h2 id="emptyTitle">No habits yet</h2>
      <p id="emptyText">Add your first habit to start tracking.</p>
      <button class="primary" id="emptyAdd">+ New habit</button>
    </div>
  </section>
</main>
<button class="fab" id="fab" aria-label="Add new habit" title="New habit">+</button>
<div class="toast" id="toast" role="status"></div>
<div id="modalRoot"></div>

<script>
(() => {
  "use strict";
  const STORAGE_KEY = "auraTracker.v1";
  const RED = "#DC2626";
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, "0");
  const localISO = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const parseDate = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d,12,0,0,0); };
  const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
  const startOfWeek = d => { const x = parseDate(localISO(d)); x.setDate(x.getDate() - ((x.getDay()+6)%7)); return x; };
  const sameDay = (a,b) => localISO(a) === localISO(b);
  const fmtFull = d => d.toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"});
  const fmtShort = d => d.toLocaleDateString("en-US",{day:"numeric",month:"short"});
  const fmtTime = s => { if(!s) return ""; const [h,m]=s.split(":").map(Number); return `${(h%12)||12}:${pad(m)} ${h>=12?"PM":"AM"}`; };
  const escapeHTML = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const ICON_GROUPS = [
    {name:"Food & Daily Life",icons:["🍎","🥗","💧","☕","🍳","🥛","🍽️","🛒"]},
    {name:"Work & Study",icons:["📚","✏️","📝","💻","🎓","🧠","📖","🧮"]},
    {name:"Fitness & Health",icons:["🏃","🏋️","🚴","🧘","⚽","💊","🛌","🚶"]},
    {name:"Entertainment",icons:["🎮","🎧","🎵","🎬","📺","🎨","📷","🎤"]},
    {name:"Personal & Home",icons:["🧹","🛁","🪥","🧺","🪴","🐾","🧴","🧼"]},
    {name:"Time & Planning",icons:["⏰","📅","✅","🎯","📌","🗓️","⏳","🔥"]}
  ];
  const CATEGORIES = ["Food","Work","Study","Gaming","Fitness","Shopping","Personal","Reminder","Other"];
  const today = parseDate(localISO(new Date()));
  let selectedDate = localISO(today);
  let activeFilter = "all";
  let statsWeek = startOfWeek(today);
  let state = {habits:[],log:{}};
  let editingId = null;
  let toastTimer = null;

  function loadState(){
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        if(parsed && Array.isArray(parsed.habits) && parsed.log && typeof parsed.log==="object") {
          state = parsed;
          state.habits = state.habits.filter(h=>h && h.id && h.name && h.date);
          return;
        }
      }
    } catch(e) { console.warn("Aura Tracker data could not be loaded.",e); }
    state = {habits:[],log:{}};
  }
  function saveState(){ try { localStorage.setItem(STORAGE_KEY,JSON.stringify(state)); } catch(e){ showToast("Could not save data on this device."); } }
  function isDone(h){ return (state.log[h.date]||[]).includes(h.id); }
  function dateHabits(date=selectedDate){ return state.habits.filter(h=>h.date===date); }
  function getStreak(name){
    const key = name.trim().toLocaleLowerCase();
    const relevant = state.habits.filter(h=>h.name.trim().toLocaleLowerCase()===key);
    let cursor = parseDate(localISO(today));
    if(!relevant.some(h=>h.date===localISO(cursor) && isDone(h))) cursor=addDays(cursor,-1);
    let count=0;
    while(true){
      const ds=localISO(cursor);
      const dayHabits=relevant.filter(h=>h.date===ds);
      if(!dayHabits.length || !dayHabits.some(isDone)) break;
      count++; cursor=addDays(cursor,-1);
    }
    return count;
  }
  function habitSort(a,b){
    if(!a.st && !b.st) return a.name.localeCompare(b.name);
    if(!a.st) return 1;
    if(!b.st) return -1;
    return a.st.localeCompare(b.st);
  }
  function renderDates(){
    const strip=$("dateStrip"); strip.innerHTML="";
    const min=addDays(today,-60), max=addDays(today,90);
    for(let d=new Date(min);d<=max;d=addDays(d,1)){
      const ds=localISO(d), selected=ds===selectedDate, isToday=sameDay(d,today);
      const b=document.createElement("button");
      b.className="date-chip"+(selected?" selected":"")+(isToday?" today":"");
      b.dataset.date=ds;
      b.innerHTML=`<span class="day">${d.toLocaleDateString("en-US",{weekday:"short"}).toUpperCase()}</span><span class="num">${d.getDate()}</span>`;
      b.setAttribute("aria-pressed",String(selected));
      b.addEventListener("click",()=>{selectedDate=ds;activeFilter="all";render();});
      strip.appendChild(b);
      if(selected) requestAnimationFrame(()=>b.scrollIntoView({block:"nearest",inline:"center",behavior:"auto"}));
    }
  }
  function render(){
    const d=parseDate(selectedDate);
    $("dateEyebrow").textContent=selectedDate===localISO(today)?"TODAY":d.toLocaleDateString("en-US",{weekday:"long"}).toUpperCase();
    $("dateTitle").textContent=fmtFull(d);
    renderDates();
    const all=dateHabits().sort(habitSort);
    const done=all.filter(isDone), pending=all.filter(h=>!isDone(h));
    $("countAll").textContent=all.length; $("countPending").textContent=pending.length; $("countDone").textContent=done.length;
    document.querySelectorAll(".tab").forEach(t=>{const active=t.dataset.filter===activeFilter;t.classList.toggle("active",active);t.setAttribute("aria-selected",String(active));});
    const pct=all.length?Math.round(done.length/all.length*100):0;
    $("progressText").textContent=`${done.length} of ${all.length} habits done`;
    $("progressPercent").textContent=`${pct}%`; $("progressFill").style.width=`${pct}%`;
    const filtered=(activeFilter==="pending"?pending:activeFilter==="done"?done:all);
    const list=$("habitList");list.innerHTML="";
    filtered.forEach(h=>{
      const isFuture=selectedDate>localISO(today);
      const card=document.createElement("article");
      card.className="habit-card"+(isDone(h)?" done":"");
      card.tabIndex=0; card.setAttribute("role","button"); card.setAttribute("aria-label",`Edit habit ${h.name}`);
      const time=h.st||h.en?`${fmtTime(h.st)||"—"}${h.en?" – "+fmtTime(h.en):""}`:"No time set";
      const streak=getStreak(h.name);
      card.innerHTML=`<div class="habit-icon">${escapeHTML(h.icon||"✅")}</div>
        <div class="habit-main"><div class="habit-name" title="${escapeHTML(h.name)}">${escapeHTML(h.name)}</div>
        <div class="habit-meta">${escapeHTML(time)} · ${escapeHTML(h.cat||"Other")}${streak>0?` · 🔥 ${streak}`:""}</div>
        <span class="priority ${escapeHTML(h.pri||"medium")}">${(h.pri||"medium").charAt(0).toUpperCase()+(h.pri||"medium").slice(1)}</span></div>
        <button class="start-task" type="button" aria-label="Start ${escapeHTML(h.name)}" ${isFuture||isDone(h)?"disabled":""}>▶ Start</button>
        <button class="check ${isDone(h)?"checked":""}" aria-label="${isDone(h)?"Mark pending":"Mark done"}" ${isFuture?"disabled":""}>${isDone(h)?"✓":""}</button>`;
      card.querySelector(".start-task").addEventListener("click",e=>{e.stopPropagation();if(!isFuture&&!isDone(h))startTaskTimer(h);});
      card.querySelector(".check").addEventListener("click",e=>{
        e.stopPropagation(); if(isFuture)return;
        const arr=state.log[h.date]||(state.log[h.date]=[]);
        if(arr.includes(h.id)) state.log[h.date]=arr.filter(id=>id!==h.id); else arr.push(h.id);
        saveState();render();
      });
      card.addEventListener("click",e=>{if(!e.target.closest(".check"))openHabitSheet(h.id);});
      card.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){if(e.target===card){e.preventDefault();openHabitSheet(h.id);}}});
      list.appendChild(card);
    });
    const isEmptyAll=state.habits.length===0, isEmptyDay=all.length===0;
    $("emptyState").hidden=filtered.length>0;
    list.hidden=filtered.length===0;
    $("listHeading").hidden=filtered.length===0;
    if(filtered.length===0){
      if(isEmptyAll){$("emptyIcon").textContent="🌱";$("emptyTitle").textContent="No habits yet";$("emptyText").textContent="Add your first habit to start tracking.";}
      else if(isEmptyDay){$("emptyIcon").textContent="📅";$("emptyTitle").textContent="No habits for this day";$("emptyText").textContent="Tap + to add one for this date.";}
      else if(activeFilter==="done"){$("emptyIcon").textContent="✅";$("emptyTitle").textContent="No completed habits";$("emptyText").textContent="Your completed habits will appear here.";}
      else {$("emptyIcon").textContent="🕒";$("emptyTitle").textContent="No pending habits";$("emptyText").textContent="All habits for this date are done.";}
    }
  }
  let taskTimerInterval=null;
  let taskTimerRemaining=0;
  let taskTimerTotal=0;
  let taskTimerRunning=false;
  let taskTimerHabit=null;
  function formatClock(seconds){const n=Math.max(0,Math.floor(seconds));return String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0");}
  function stopTaskTimer(){if(taskTimerInterval){clearInterval(taskTimerInterval);taskTimerInterval=null;}taskTimerRunning=false;}
  function paintTaskTimer(){
    const digits=$("timerDigits"), ring=$("timerRing"), status=$("timerStatus"), toggle=$("timerToggle");
    if(!digits||!ring)return;
    digits.textContent=formatClock(taskTimerRemaining);
    digits.classList.remove("tick");void digits.offsetWidth;digits.classList.add("tick");
    const pct=taskTimerTotal?Math.max(0,taskTimerRemaining/taskTimerTotal*100):0;
    ring.style.setProperty("--timer-progress",pct+"%");
    status.textContent=taskTimerRemaining===0?"TIME COMPLETE":taskTimerRunning?"FOCUS IN PROGRESS":"READY WHEN YOU ARE";
    toggle.textContent=taskTimerRemaining===0?"Restart":taskTimerRunning?"Pause":"Resume";
  }
  function startTaskTimer(h){
    stopTaskTimer();taskTimerHabit=h;
    const match=String(h.name||"").match(/\((\d+)\s*min(?:ute)?s?\)/i);
    taskTimerTotal=(match?Number(match[1]):25)*60;
    taskTimerRemaining=taskTimerTotal;
    openModal(`<section class="sheet" role="dialog" aria-modal="true" aria-labelledby="timerTitle">
      <div class="sheet-head"><h2 id="timerTitle">Focus Timer</h2><button type="button" class="close-btn" id="closeTimer" aria-label="Close timer">×</button></div>
      <div class="timer-panel"><span class="timer-session">${escapeHTML(h.icon||"⏱️")} ${escapeHTML(h.name)}</span>
      <div class="timer-ring" id="timerRing"><div class="timer-inner"><div class="timer-digits" id="timerDigits">${formatClock(taskTimerRemaining)}</div><div class="timer-caption">MINUTES : SECONDS</div></div></div>
      <div class="timer-status" id="timerStatus" style="font-size:11px;font-weight:800;letter-spacing:1px;margin-bottom:16px;color:#be123c">READY WHEN YOU ARE</div>
      <p class="timer-hint">Put distractions aside and focus on this task until the timer ends. You can pause whenever needed.</p>
      <div class="timer-actions"><button type="button" class="primary" id="timerToggle">Start focus</button><button type="button" class="secondary" id="timerReset">Reset</button></div></div>
    </section>`);
    paintTaskTimer();
    $("timerToggle").textContent="Start focus";
    $("timerToggle").addEventListener("click",()=>{
      if(taskTimerRemaining<=0){taskTimerRemaining=taskTimerTotal;}
      if(taskTimerRunning){stopTaskTimer();paintTaskTimer();return;}
      taskTimerRunning=true;paintTaskTimer();
      taskTimerInterval=setInterval(()=>{
        taskTimerRemaining--;
        if(taskTimerRemaining<=0){taskTimerRemaining=0;stopTaskTimer();paintTaskTimer();showToast("Focus session complete! Take a short break.");return;}
        paintTaskTimer();
      },1000);
    });
    $("timerReset").addEventListener("click",()=>{stopTaskTimer();taskTimerRemaining=taskTimerTotal;paintTaskTimer();$("timerToggle").textContent="Start focus";});
    $("closeTimer").addEventListener("click",()=>{stopTaskTimer();closeModal();});
    // Begin counting immediately when the user taps the task's Start button.
    $("timerToggle").click();
  }
  function showToast(msg){const t=$("toast");t.textContent=msg;t.style.display="block";clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.display="none",2300);}
  function quickAddHabit(name){
    const idFor = () => (crypto.randomUUID ? crypto.randomUUID() : "h"+Date.now().toString(36)+Math.random().toString(36).slice(2));
    const plans = {
      "Workout": [
        {name:"Warm-up (5 min)",icon:"🔥",cat:"Fitness",mins:5,notes:"March in place, arm circles, gentle jumping jacks. Warm up before exercising."},
        {name:"Chest: wall/knee push-ups (5 min)",icon:"💪",cat:"Fitness",mins:5,notes:"2 sets of 6–10 comfortable reps. Keep good form; stop if there is pain."},
        {name:"Back: bird-dog + superman (5 min)",icon:"🪽",cat:"Fitness",mins:5,notes:"Bird-dog 2×8 each side; gentle superman 2×8. No jerking or over-arching."},
        {name:"Abs: dead bug + plank (5 min)",icon:"🎯",cat:"Fitness",mins:5,notes:"Dead bug 2×8 each side; plank 2×15–25 seconds. Keep breathing."},
        {name:"Legs: squats + reverse lunges (7 min)",icon:"🦵",cat:"Fitness",mins:7,notes:"Bodyweight squats 2×10 and reverse lunges 2×6 each leg. Use a chair/wall for balance if needed."},
        {name:"Shoulders & arms (4 min)",icon:"🏋️",cat:"Fitness",mins:4,notes:"Arm circles and wall push-ups at an easy pace; no heavy weights needed."},
        {name:"Cool-down & stretch (4 min)",icon:"🧘",cat:"Fitness",mins:4,notes:"Slow walking, gentle chest, back, quad and calf stretches. Do not force stretches."}
      ],
      "Study": [
        {name:"Class 8 Mathematics (30 min)",icon:"🧮",cat:"Study",mins:30,notes:"Study one current textbook topic/chapter, solve 5–10 questions, and check mistakes."},
        {name:"Class 8 Science (25 min)",icon:"🔬",cat:"Study",mins:25,notes:"Read one topic, learn key definitions/diagrams, then answer 3 questions."},
        {name:"Class 8 Social Science (25 min)",icon:"🌍",cat:"Study",mins:25,notes:"Rotate History, Geography and Civics according to your school syllabus; revise one topic."},
        {name:"Class 8 English (20 min)",icon:"📘",cat:"Study",mins:20,notes:"Read a lesson, learn 5 new words, and practise grammar or writing."},
        {name:"Class 8 Hindi (20 min)",icon:"📝",cat:"Study",mins:20,notes:"Read a lesson/poem, revise meanings, and practise grammar or written answers."},
        {name:"Class 8 Punjabi (20 min)",icon:"📗",cat:"Study",mins:20,notes:"Read the current Punjabi lesson, learn difficult words, and practise written answers."},
        {name:"Class 8 Computer (15 min)",icon:"💻",cat:"Study",mins:15,notes:"Revise the chapter or practical topic included in your school's syllabus."},
        {name:"Revision & homework (15 min)",icon:"✍️",cat:"Study",mins:15,notes:"Finish school homework and quickly recall today's main points without looking at the book."}
      ],
      "Book Reading": [
        {name:"Book Reading (20 min)",icon:"📖",cat:"Personal",mins:20,notes:"Read a book for 20 minutes and note one idea or new word."}
      ],
      "Stretching + Meditation": [
        {name:"Full-body stretching (10 min)",icon:"🤸",cat:"Fitness",mins:10,notes:"Stretch gently for 10 minutes. Avoid bouncing and stop if anything hurts."},
        {name:"Meditation (10 min)",icon:"🧘",cat:"Personal",mins:10,notes:"Sit comfortably, breathe naturally, and focus on your breathing for 10 minutes."}
      ]
    };
    const plan = plans[name];
    if(!plan)return;
    const existingNames = new Set(state.habits.filter(h=>h.date===selectedDate).map(h=>h.name.trim().toLowerCase()));
    const added = [];
    const skipped = [];
    plan.forEach(item=>{
      if(existingNames.has(item.name.toLowerCase())){skipped.push(item.name);return;}
      state.habits.push({
        id:idFor(), name:item.name, icon:item.icon, cat:item.cat, date:selectedDate,
        st:"", en:"", pri:"medium",
        notes:item.notes+" Suggested duration: "+item.mins+" minutes."
      });
      existingNames.add(item.name.toLowerCase());
      added.push(item);
    });
    if(!added.length){showToast(name+" plan is already added for this date.");return;}
    saveState();activeFilter="all";render();
    const totalMins=added.reduce((sum,item)=>sum+item.mins,0);
    const duration=totalMins>=60?Math.floor(totalMins/60)+"h "+(totalMins%60?totalMins%60+"m":""):totalMins+" min";
    showToast(added.length+" tasks added · "+duration+(skipped.length?" · existing tasks skipped":""));
  }
  function openModal(content){
    const root=$("modalRoot");root.innerHTML="";
    const overlay=document.createElement("div");overlay.className="overlay";
    overlay.innerHTML=content;
    overlay.addEventListener("click",e=>{if(e.target===overlay)closeModal();});
    root.appendChild(overlay);
    document.body.style.overflow="hidden";
    const first=overlay.querySelector("input,button,select,textarea");if(first)first.focus();
  }
  function closeModal(){if(taskTimerInterval){clearInterval(taskTimerInterval);taskTimerInterval=null;}taskTimerRunning=false;$("modalRoot").innerHTML="";document.body.style.overflow="";}
  function openHabitSheet(id=null){
    editingId=id;
    const h=id?state.habits.find(x=>x.id===id):null;
    const icon=h?.icon||"✅", cat=h?.cat||"Personal", pri=h?.pri||"medium";
    const iconGroups=ICON_GROUPS.map(g=>`<div class="field"><label>${escapeHTML(g.name)}</label><div class="icon-grid">${g.icons.map(i=>`<button type="button" class="icon-option ${i===icon?"chosen":""}" data-icon="${escapeHTML(i)}" aria-label="Choose ${escapeHTML(i)}">${i}</button>`).join("")}</div></div>`).join("");
    const categories=CATEGORIES.map(c=>`<option ${c===(h?.cat||cat)?"selected":""}>${c}</option>`).join("");
    openModal(`<section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-head"><h2 id="sheetTitle">${h?"Edit habit":"New habit"}</h2><button type="button" class="close-btn" id="closeSheet" aria-label="Close">×</button></div>
      <form id="habitForm" novalidate>
        <div class="field"><label for="habitName">Habit name *</label><input id="habitName" maxlength="40" placeholder="e.g. Morning Run" value="${escapeHTML(h?.name||"")}" autocomplete="off" required></div>
        <div class="field"><label>Icon</label><div id="iconGroups">${iconGroups}</div></div>
        <div class="field"><label for="habitCategory">Category</label><select id="habitCategory">${categories}</select></div>
        <div class="field"><label for="habitDate">Date</label><input id="habitDate" type="date" value="${escapeHTML(h?.date||selectedDate)}" required></div>
        <div class="field-row">
          <div class="field"><label for="habitStart">Start time (optional)</label><input id="habitStart" type="time" value="${escapeHTML(h?.st||"")}"></div>
          <div class="field"><label for="habitEnd">End time (optional)</label><input id="habitEnd" type="time" value="${escapeHTML(h?.en||"")}"></div>
        </div>
        <div class="field"><label for="habitPriority">Priority</label><select id="habitPriority"><option value="low" ${pri==="low"?"selected":""}>Low</option><option value="medium" ${pri==="medium"?"selected":""}>Medium</option><option value="high" ${pri==="high"?"selected":""}>High</option></select></div>
        <div class="field"><label for="habitNotes">Details / Notes (optional)</label><textarea id="habitNotes" placeholder="Add a note...">${escapeHTML(h?.notes||"")}</textarea></div>
        <div class="error" id="formError">Please enter a habit name.</div>
        <div class="form-actions"><button type="button" class="secondary" id="cancelSheet">Cancel</button><button type="submit" class="primary">Save Habit</button></div>
        ${h?'<button type="button" class="delete-btn" id="deleteHabit">Delete habit</button>':""}
      </form></section>`);
    let chosenIcon=icon;
    $("closeSheet").addEventListener("click",closeModal);
    $("cancelSheet").addEventListener("click",closeModal);
    document.querySelectorAll(".icon-option").forEach(b=>b.addEventListener("click",()=>{
      chosenIcon=b.dataset.icon;document.querySelectorAll(".icon-option").forEach(x=>x.classList.toggle("chosen",x.dataset.icon===chosenIcon));
    }));
    $("habitName").addEventListener("input",()=>{$("formError").style.display="none";});
    $("habitForm").addEventListener("submit",e=>{
      e.preventDefault();
      const name=$("habitName").value.trim();
      if(!name){$("formError").style.display="block";$("habitName").focus();return;}
      const date=$("habitDate").value;
      if(!date){showToast("Choose a date.");return;}
      const data={name,icon:chosenIcon,cat:$("habitCategory").value,date,st:$("habitStart").value,en:$("habitEnd").value,pri:$("habitPriority").value,notes:$("habitNotes").value.trim()};
      if(editingId){
        const old=state.habits.find(x=>x.id===editingId);
        if(old && old.date!==date && state.log[old.date]) state.log[old.date]=state.log[old.date].filter(x=>x!==old.id);
        Object.assign(old,data);
        if(!old.id)old.id=editingId;
      }else{
        data.id=(crypto.randomUUID?crypto.randomUUID():"h"+Date.now().toString(36)+Math.random().toString(36).slice(2));
        state.habits.push(data);
      }
      saveState();selectedDate=date;activeFilter="all";closeModal();render();showToast(editingId?"Habit updated.":"Habit saved.");
    });
    if(h)$("deleteHabit").addEventListener("click",()=>{
      if(!confirm(`Delete "${h.name}"? This cannot be undone.`))return;
      state.habits=state.habits.filter(x=>x.id!==h.id);
      Object.keys(state.log).forEach(date=>{state.log[date]=state.log[date].filter(x=>x!==h.id);if(!state.log[date].length)delete state.log[date];});
      saveState();closeModal();render();showToast("Habit deleted.");
    });
  }
  function weekHabits(weekStart){
    const dates=Array.from({length:7},(_,i)=>localISO(addDays(weekStart,i)));
    const habits=state.habits.filter(h=>dates.includes(h.date));
    const uniqueNames=[...new Map(habits.map(h=>[h.name.trim().toLocaleLowerCase(),h.name.trim()])).entries()];
    const doneCount=habits.filter(isDone).length;
    return {dates,habits,uniqueNames,doneCount,total:habits.length};
  }
  function openStats(){
    statsWeek=startOfWeek(parseDate(selectedDate));
    renderStats();
  }
  function renderStats(){
    const {dates,habits,uniqueNames,doneCount,total}=weekHabits(statsWeek);
    const pct=total?Math.round(doneCount/total*100):0;
    const thisWeek=startOfWeek(today);
    const isCurrent=sameDay(statsWeek,thisWeek);
    const label=isCurrent?"This week":`${fmtShort(statsWeek)} – ${fmtShort(addDays(statsWeek,6))}`;
    const daily=dates.map((date,i)=>{
      const hs=habits.filter(h=>h.date===date), dn=hs.filter(isDone).length, p=hs.length?Math.round(dn/hs.length*100):0;
      return `<div class="day-bar"><div class="bar-area">${hs.length?`<div class="bar-fill" style="height:${p}%"></div>`:""}</div><div class="bar-pct">${hs.length?p+"%":"–"}</div><div class="bar-day">${["MON","TUE","WED","THU","FRI","SAT","SUN"][i]}</div></div>`;
    }).join("");
    const byHabit=uniqueNames.map(([key,name])=>{
      const hs=habits.filter(h=>h.name.trim().toLocaleLowerCase()===key), dn=hs.filter(isDone).length, p=hs.length?Math.round(dn/hs.length*100):0;
      return `<div class="habit-stat"><div class="habit-stat-top"><span class="habit-stat-name">${escapeHTML(name)}</span><span class="habit-stat-count">${dn}/${hs.length} · ${p}%</span></div><div class="small-track"><div class="small-fill" style="width:${p}%"></div></div></div>`;
    }).join("");
    openModal(`<section class="sheet" role="dialog" aria-modal="true" aria-labelledby="statsTitle">
      <div class="sheet-head"><h2 id="statsTitle">Weekly stats</h2><button type="button" class="close-btn" id="closeStats" aria-label="Close">×</button></div>
      <div class="week-row"><button class="week-arrow" id="prevWeek" aria-label="Previous week">‹</button><div class="week-label">${label}</div><button class="week-arrow" id="nextWeek" aria-label="Next week" ${isCurrent?"disabled":""}>›</button></div>
      <div class="stats-summary"><div class="summary-card"><div class="summary-label">Week completion</div><div class="summary-value">${pct}%</div><div class="summary-sub">of scheduled habits</div></div><div class="summary-card"><div class="summary-label">Habits completed</div><div class="summary-value">${doneCount}/${total}</div><div class="summary-sub">done / total</div></div></div>
      <div class="stats-title">Daily completion</div><div class="daily-bars">${daily}</div>
      <div class="stats-title">By habit</div>${byHabit||'<div class="no-stats">No habits scheduled this week</div>'}
    </section>`);
    $("closeStats").addEventListener("click",closeModal);
    $("prevWeek").addEventListener("click",()=>{statsWeek=addDays(statsWeek,-7);renderStats();});
    $("nextWeek").addEventListener("click",()=>{if(!isCurrent){statsWeek=addDays(statsWeek,7);renderStats();}});
  }
  document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{activeFilter=t.dataset.filter;render();}));
  $("fab").addEventListener("click",()=>openHabitSheet());
  $("emptyAdd").addEventListener("click",()=>openHabitSheet());
  document.querySelectorAll("[data-quick]").forEach(button=>button.addEventListener("click",()=>quickAddHabit(button.dataset.quick)));
  $("statsOpen").addEventListener("click",openStats);
  $("backBtn").addEventListener("click",()=>{
    if($("modalRoot").innerHTML){closeModal();return;}
    if(selectedDate!==localISO(today)){selectedDate=localISO(today);activeFilter="all";render();showToast("Back to today");return;}
    if(activeFilter!=="all"){activeFilter="all";render();showToast("Back to all habits");return;}
    if(window.history.length>1){window.history.back();return;}
    showToast("You are on the main screen");
  });
  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("modalRoot").innerHTML)closeModal();});
  loadState();render();
})();
</script>
</body>
</html>
